# Full stack: API + PostgreSQL. Works out of the box; values can be overridden in .env.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-simplebank}
      POSTGRES_USER: ${DB_USER:-simplebank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-simplebank}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    environment:
      DJANGO_SECRET: ${DJANGO_SECRET:-insecure-local-only-secret-key-change-me-0123456789}
      DEBUG: ${DEBUG:-false}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-simplebank}
      DB_USER: ${DB_USER:-simplebank}
      DB_PASSWORD: ${DB_PASSWORD:-simplebank}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

volumes:
  pg_data:
